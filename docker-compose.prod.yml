version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talkbridge
      POSTGRES_USER: talkbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed externally — only reachable by backend inside Docker network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://talkbridge:${DB_PASSWORD}@postgres:5432/talkbridge?sslmode=disable
      PORT: 8080
      FRONTEND_URL: https://${DOMAIN}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${DOMAIN}
        NEXT_PUBLIC_TURN_URL: ${TURN_URL:-}
        NEXT_PUBLIC_TURN_USERNAME: ${TURN_USERNAME:-}
        NEXT_PUBLIC_TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-7080}:80"
      - "${HTTPS_PORT:-7443}:443"
    volumes:
      - ./nginx/talkbridge.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
