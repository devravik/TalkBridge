# coturn TURN server configuration for TalkBridge
# Replace SERVER_PUBLIC_IP, YOUR_DOMAIN, and TURN_PASSWORD below

listening-port=3478
tls-listening-port=5349

listening-ip=0.0.0.0
relay-ip=SERVER_PUBLIC_IP
external-ip=SERVER_PUBLIC_IP

realm=YOUR_DOMAIN
server-name=YOUR_DOMAIN

# Long-term credential mechanism
lt-cred-mech
user=talkbridge:TURN_PASSWORD

fingerprint
no-multicast-peers

# TLS cert (same cert as your domain)
cert=/etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem

# Log
log-file=/var/log/turnserver.log
simple-log

# Block relay to private IP ranges (security)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
